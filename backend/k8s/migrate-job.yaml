apiVersion: batch/v1
kind: Job
metadata:
  name: ecotrees-migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: ecotrees-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/obed-ojingwa/eco_trees:latest
          command:
            - python
            - -m
            - app.db.migrate
          env:
            - name: ENVIRONMENT
              value: migration
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ecotrees-secrets
                  key: DB_URL
            - name: DB_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: ecotrees-migration
                  key: DB_MIGRATION_URL
