apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/obed-ojingwa/eco_trees:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ecotrees-secrets
                  key: DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecotrees-secrets
                  key: JWT_SECRET
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ecotrees-secrets
                  key: INGEST_TOKEN
            - name: CARBON_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: ecotrees-secrets
                  key: CARBON_SIGNING_KEY
            - name: CARBON_SIGNING_KEY_ID
              value: ecotrees-hmac-v1
            - name: FORGE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecotrees-secrets
                  key: FORGE_WEBHOOK_SECRET
            - name: PAYOUT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ecotrees-secrets
                  key: PAYOUT_ENCRYPTION_KEY
            - name: TREASURY_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: ecotrees-secrets
                  key: TREASURY_ACCOUNT
            - name: PAYMENT_BACKEND
              value: xtradot
            - name: PUBLIC_BASE_URL
              value: https://team09.xtradot.co
            - name: WEBHOOK_URL
              value: http://app.team09.svc.cluster.local/hooks/forge
            - name: CHECKOUT_FEE_BPS
              value: "0"
            - name: PAYOUT_FEE_BPS
              value: "0"
            - name: ORDER_EXPIRY_MINUTES
              value: "30"
            - name: REGISTRY_BACKEND
              value: mock
            - name: REGISTRY_XTRADOT_ENABLED
              value: "false"
            - name: BANK_API_BASE
              value: http://bank-api.ingress-apisix.svc.cluster.local/v1
            - name: BANK_RPM_BUDGET
              value: "45"
            - name: CORS_ORIGINS
              value: https://eco-trees.vercel.app
            - name: GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: huawei-gateway
                  key: GATEWAY_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
