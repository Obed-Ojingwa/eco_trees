apiVersion: v1
kind: ConfigMap
metadata:
  name: ecotrees-db-init
data:
  001_app_role.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set=app_password="$DB_APP_PASSWORD" <<'SQL'
    CREATE ROLE ecotrees LOGIN PASSWORD :'app_password';
    GRANT CONNECT ON DATABASE ecotrees TO ecotrees;
    GRANT USAGE ON SCHEMA public TO ecotrees;
    ALTER DEFAULT PRIVILEGES FOR ROLE ecotrees_admin IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ecotrees;
    SQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ecotrees
            - name: POSTGRES_USER
              value: ecotrees_admin
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecotrees-db-admin
                  key: DB_ADMIN_PASSWORD
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecotrees-db-admin
                  key: DB_APP_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/001_app_role.sh
              subPath: 001_app_role.sh
              readOnly: true
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ecotrees_admin
                - -d
                - ecotrees
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
        - name: init
          configMap:
            name: ecotrees-db-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
